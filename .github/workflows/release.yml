name: Release

# Builds the AU + VST3 on macOS (AU only compiles there) and publishes them
# as a GitHub release. Triggered by pushing a v* tag, or manually with a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Codesign (ad-hoc)
        run: |
          AU=build/AutoTrim_artefacts/Release/AU/AutoTrim.component
          VST3=build/AutoTrim_artefacts/Release/VST3/AutoTrim.vst3
          codesign --force --deep -s - "$AU"
          codesign --force --deep -s - "$VST3"

      - name: Package
        run: |
          AU=build/AutoTrim_artefacts/Release/AU/AutoTrim.component
          VST3=build/AutoTrim_artefacts/Release/VST3/AutoTrim.vst3
          ditto -c -k --keepParent "$AU" AutoTrim-AU.zip
          ditto -c -k --keepParent "$VST3" AutoTrim-VST3.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          NOTES="AutoTrim ${TAG} — Audio Unit (.component) e VST3 para macOS (universal arm64+x86_64, assinatura ad-hoc).

          Instalação:
          - AU: descompacte e copie AutoTrim.component para ~/Library/Audio/Plug-Ins/Components/
          - VST3: descompacte e copie AutoTrim.vst3 para ~/Library/Audio/Plug-Ins/VST3/

          Assinatura ad-hoc: na primeira vez pode ser necessário liberar no Gatekeeper (clique com o botão direito > Abrir, ou remova a quarentena com \`xattr -dr com.apple.quarantine\`)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AutoTrim-AU.zip AutoTrim-VST3.zip --clobber
          else
            gh release create "$TAG" AutoTrim-AU.zip AutoTrim-VST3.zip \
              --title "AutoTrim ${TAG}" --notes "$NOTES"
          fi
